apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: traceflow
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: traceflow-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          envFrom:
            - configMapRef:
                name: traceflow-config
          env:
            - name: SERVICE_NAME
              value: payment-service
            - name: PORT
              value: "8003"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: traceflow
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8003
      targetPort: http
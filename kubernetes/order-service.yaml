apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: traceflow
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: traceflow-order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: traceflow-config
          env:
            - name: SERVICE_NAME
              value: order-service
            - name: PORT
              value: "8002"
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8003     # service discovery by name
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: traceflow
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8002
      targetPort: http
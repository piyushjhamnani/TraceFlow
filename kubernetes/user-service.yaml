apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: traceflow
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: traceflow-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: traceflow-config
          env:
            - name: SERVICE_NAME
              value: user-service
            - name: PORT
              value: "8001"
            - name: ORDER_SERVICE_URL
              value: http://order-service:8002       # service discovery by name
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: traceflow
spec:
  selector:
    app: user-service
  ports:
    - name: http
      port: 8001
      targetPort: http
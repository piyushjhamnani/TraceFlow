# TraceFlow CI/CD pipeline
#
#   git push
#     -> test   : install dependencies + run the automated tests (4 components in parallel)
#     -> build  : validate docker-compose.yml, build all Docker images, start the whole
#                 stack and run an end-to-end smoke test (normal / slow / fail),
#                 then (main branch only) push the images to GitHub Container Registry.
#     -> deploy : create a Kubernetes cluster (kind), deploy kubernetes/, run the
#                 end-to-end test inside Kubernetes, demonstrate scaling and self-healing.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:          # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - services/user-service
          - services/order-service
          - services/payment-service
          - traceflow
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.component }}/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.component }}/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest ${{ matrix.component }} -v

  build:
    name: Build images + end-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # needed to push images to GitHub Container Registry
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build all Docker images
        run: docker compose build

      - name: Start the full stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: End-to-end smoke test (normal, slow, fail)
        run: |
          set -euo pipefail
          for mode in normal slow fail; do
            echo "Sending $mode checkout..."
            curl -fsS -X POST "http://localhost:8000/api/demo/checkout?mode=$mode"
            echo
          done

          echo "Waiting for TraceFlow to buffer, analyze and sample the traces..."
          for i in $(seq 1 30); do
            total=$(curl -fsS http://localhost:8000/api/summary | jq '.total_traces')
            if [ "$total" -ge 3 ]; then break; fi
            sleep 2
          done

          summary=$(curl -fsS http://localhost:8000/api/summary)
          echo "$summary" | jq .
          test "$(echo "$summary" | jq '.total_traces')" -eq 3
          test "$(echo "$summary" | jq '.retained_traces')" -eq 2
          test "$(echo "$summary" | jq '.error_traces')" -eq 1
          test "$(echo "$summary" | jq '.slow_traces')" -eq 1
          echo "Smoke test passed: normal trace dropped, slow + error traces kept."

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push images to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          for image in traceflow-user-service traceflow-order-service traceflow-payment-service traceflow-engine; do
            for tag in latest "$short_sha"; do
              docker tag "$image:latest" "ghcr.io/$owner/$image:$tag"
              docker push "ghcr.io/$owner/$image:$tag"
            done
          done

  deploy:
    name: Deploy to Kubernetes + scaling & self-healing test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: traceflow

      - name: Load images into the cluster
        run: |
          kind load docker-image --name traceflow \
            traceflow-engine:latest \
            traceflow-user-service:latest \
            traceflow-order-service:latest \
            traceflow-payment-service:latest

      - name: Deploy TraceFlow (kubectl apply -k kubernetes/)
        run: |
          kubectl apply -k kubernetes/
          kubectl -n traceflow wait --for=condition=available deployment --all --timeout=300s
          kubectl -n traceflow get deployments,pods,services,pvc -o wide

      - name: Open the TraceFlow port (kubectl port-forward)
        run: |
          kubectl -n traceflow port-forward svc/traceflow 8000:8000 > /tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "TraceFlow is reachable through the Kubernetes Service"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/port-forward.log
          exit 1

      - name: End-to-end test inside Kubernetes (normal, slow, fail)
        run: |
          set -euo pipefail
          for mode in normal slow fail; do
            echo "Sending $mode checkout..."
            curl -fsS -X POST "http://localhost:8000/api/demo/checkout?mode=$mode"
            echo
          done
          for i in $(seq 1 45); do
            total=$(curl -fsS http://localhost:8000/api/summary | jq '.total_traces')
            if [ "$total" -ge 3 ]; then break; fi
            sleep 2
          done
          summary=$(curl -fsS http://localhost:8000/api/summary)
          echo "$summary" | jq .
          test "$(echo "$summary" | jq '.total_traces')" -eq 3
          test "$(echo "$summary" | jq '.retained_traces')" -eq 2
          echo "Kubernetes end-to-end test passed."

      - name: Scaling - order-service from 1 to 3 pods
        run: |
          set -euo pipefail
          kubectl -n traceflow scale deployment/order-service --replicas=3
          kubectl -n traceflow rollout status deployment/order-service --timeout=120s
          kubectl -n traceflow get pods -l app=order-service -o wide
          ready=$(kubectl -n traceflow get deployment order-service -o jsonpath='{.status.readyReplicas}')
          test "$ready" -eq 3
          echo "Scaling passed: 3 order-service pods are ready behind one Service."

      - name: Self-healing - delete a payment-service pod
        run: |
          set -euo pipefail
          old_pod=$(kubectl -n traceflow get pods -l app=payment-service -o jsonpath='{.items[0].metadata.name}')
          echo "Deleting pod $old_pod to simulate a crash..."
          kubectl -n traceflow delete pod "$old_pod"
          for i in $(seq 1 30); do
            count=$(kubectl -n traceflow get pods -l app=payment-service --no-headers 2>/dev/null | wc -l)
            if [ "$count" -ge 1 ]; then break; fi
            sleep 1
          done
          kubectl -n traceflow wait --for=condition=ready pod -l app=payment-service --timeout=120s
          new_pod=$(kubectl -n traceflow get pods -l app=payment-service -o jsonpath='{.items[0].metadata.name}')
          kubectl -n traceflow get pods -l app=payment-service -o wide
          test "$new_pod" != "$old_pod"
          echo "Self-healing passed: Kubernetes replaced $old_pod with $new_pod."

      - name: System still works after scaling and recovery
        run: |
          set -euo pipefail
          curl -fsS -X POST "http://localhost:8000/api/demo/checkout?mode=fail"
          echo
          for i in $(seq 1 45); do
            total=$(curl -fsS http://localhost:8000/api/summary | jq '.total_traces')
            if [ "$total" -ge 4 ]; then break; fi
            sleep 2
          done
          summary=$(curl -fsS http://localhost:8000/api/summary)
          echo "$summary" | jq .
          test "$(echo "$summary" | jq '.total_traces')" -eq 4
          test "$(echo "$summary" | jq '.error_traces')" -eq 2
          kubectl -n traceflow get pods -o wide
          echo "TraceFlow keeps working after scaling and pod recovery."

      - name: Show Kubernetes state on failure
        if: failure()
        run: |
          kubectl -n traceflow get all -o wide || true
          kubectl -n traceflow describe pods || true
          for d in traceflow otel-collector user-service order-service payment-service; do
            echo "===== logs: $d ====="
            kubectl -n traceflow logs deployment/$d --tail=80 || true
          done